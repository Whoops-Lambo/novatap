name: Build iPhone IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check game logic
        run: npm ci && npm test
      - name: Build device IPA for Sideloadly
        run: bash scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NovaTap-iPhone-IPA
          path: artifacts/NovaTap.ipa
          if-no-files-found: error
